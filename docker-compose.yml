# Kesari behind host nginx (recommended on shared VPS).
#
#   cp .env.example .env && nano .env
#   docker compose up -d --build
#   # then install deploy/nginx.conf.example as an nginx site
#
# Optional bundled MongoDB:  docker compose --profile local-db up -d --build
# Optional Caddy (sole occupant of 80/443):  docker compose --profile caddy up -d

name: kesari

x-restart: &restart
  restart: unless-stopped

services:
  backend:
    <<: *restart
    build:
      context: ./backend
    image: kesari-api:latest
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      AWS_S3_PUBLIC_URL: https://${DOMAIN}/img
    # So MONGODB_URI=mongodb://host.docker.internal:27017/kesari reaches host mongod.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-4000}:4000"
    networks: [kesari]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    <<: *restart
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Set DOMAIN in .env}/api
    image: kesari-web:latest
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:4000/api
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3020}:3000"
    volumes:
      - next-cache:/app/.next/cache
    depends_on:
      backend:
        condition: service_healthy
    networks: [kesari]
    logging: *logging

  # Only if nothing else owns 80/443 on the host.
  caddy:
    <<: *restart
    profiles: ["caddy"]
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    networks: [kesari]
    logging: *logging

  mongo:
    <<: *restart
    profiles: ["local-db"]
    image: mongo:7
    command: ["--quiet"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [kesari]
    logging: *logging

networks:
  kesari: {}

volumes:
  next-cache: {}
  caddy-data: {}
  caddy-config: {}
  mongo-data: {}
